name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # o el nombre de tu rama principal

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sube únicamente 1 artefacto específico para Pages
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "." # o la carpeta donde está tu index.html (ej. './')

      # Despliega el artefacto generado
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
